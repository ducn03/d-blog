<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — D-Insights</title>
  <meta name="description" content="{{EXCERPT}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/post.css">
</head>

<body>

  <site-header root-path="../"></site-header>

  <!-- HERO -->
  <section class="hero container">
    <div class="hero__pill">
      <a href="../category/{{CATEGORY_SLUG}}.html" class="pill pill--{{CATEGORY_SLUG}}">{{CATEGORY_NAME}}</a>
    </div>
    <h1 class="hero__title">{{TITLE}}</h1>
    <div class="hero__meta">
      <span>{{AUTHOR}}</span>
      <span class="hero__meta-dot"></span>
      <span>{{DATE}}</span>
      <span class="hero__meta-dot"></span>
      <span>{{READING_TIME}} phút đọc</span>
    </div>
    <div class="hero__cover">
      <img src="../{{COVER}}" alt="{{TITLE}}">
    </div>
  </section>

  <!-- POST BODY -->
  <article class="post-body">
    <!-- POST_BODY_START -->

    <!-- Viết nội dung bài viết ở đây -->
    <!-- Chỉ dùng các thẻ HTML chuẩn: h2, h3, p, ul, ol, blockquote, img, pre/code, a, strong, em -->

    <!-- POST_BODY_END -->
  </article>

  <script src="../assets/js/site-config.js"></script>

  <site-footer root-path="../"></site-footer>

  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/main.js"></script>
</body>

</html>
