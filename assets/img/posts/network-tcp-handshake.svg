<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">TCP three-way handshake</title>
  <desc id="desc">Client sends SYN, server replies SYN-ACK, and client sends ACK.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2878a8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3f8b68"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c97835"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f4f0e8"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18343c">TCP 3-way handshake</text>
  <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18343c">Client</text>
  <text x="900" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18343c">Server</text>
  <line x1="300" y1="130" x2="300" y2="455" stroke="#8ca3a8" stroke-width="4"/>
  <line x1="900" y1="130" x2="900" y2="455" stroke="#8ca3a8" stroke-width="4"/>
  <line x1="300" y1="190" x2="900" y2="190" stroke="#2878a8" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <rect x="480" y="155" width="240" height="54" rx="27" fill="#d8ecf5"/>
  <text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1b5d80">1. SYN</text>
  <line x1="900" y1="290" x2="300" y2="290" stroke="#3f8b68" stroke-width="6" marker-end="url(#arrow-green)"/>
  <rect x="455" y="255" width="290" height="54" rx="27" fill="#dcefe5"/>
  <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#28694b">2. SYN-ACK</text>
  <line x1="300" y1="390" x2="900" y2="390" stroke="#c97835" stroke-width="6" marker-end="url(#arrow-orange)"/>
  <rect x="480" y="355" width="240" height="54" rx="27" fill="#f7e3cf"/>
  <text x="600" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#93511f">3. ACK</text>
  <text x="600" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4f6267">Both sides now know the connection is ready.</text>
</svg>
