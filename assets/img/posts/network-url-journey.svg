<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">What happens when opening a URL</title>
  <desc id="desc">Browser resolves DNS, opens TCP, performs TLS, sends an HTTP request, and renders the response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2878a8"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#eef4f1"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#18343c">From URL to rendered page</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="180" height="115" rx="18" fill="#fff" stroke="#2878a8" stroke-width="3"/>
    <text x="145" y="187" font-size="22" font-weight="700" fill="#18343c">1. Browser</text>
    <text x="145" y="220" font-size="17" fill="#4f6267">You type a URL</text>
    <rect x="275" y="145" width="180" height="115" rx="18" fill="#fff" stroke="#3f8b68" stroke-width="3"/>
    <text x="365" y="187" font-size="22" font-weight="700" fill="#18343c">2. DNS</text>
    <text x="365" y="220" font-size="17" fill="#4f6267">Domain to IP</text>
    <rect x="495" y="145" width="180" height="115" rx="18" fill="#fff" stroke="#c97835" stroke-width="3"/>
    <text x="585" y="187" font-size="22" font-weight="700" fill="#18343c">3. TCP</text>
    <text x="585" y="220" font-size="17" fill="#4f6267">Open connection</text>
    <rect x="715" y="145" width="180" height="115" rx="18" fill="#fff" stroke="#a55778" stroke-width="3"/>
    <text x="805" y="187" font-size="22" font-weight="700" fill="#18343c">4. TLS</text>
    <text x="805" y="220" font-size="17" fill="#4f6267">Encrypt channel</text>
    <rect x="935" y="145" width="210" height="115" rx="18" fill="#fff" stroke="#6b6094" stroke-width="3"/>
    <text x="1040" y="187" font-size="22" font-weight="700" fill="#18343c">5. HTTP</text>
    <text x="1040" y="220" font-size="17" fill="#4f6267">Request and render</text>
  </g>
  <g stroke="#2878a8" stroke-width="5" marker-end="url(#arrow)">
    <line x1="235" y1="202" x2="268" y2="202"/>
    <line x1="455" y1="202" x2="488" y2="202"/>
    <line x1="675" y1="202" x2="708" y2="202"/>
    <line x1="895" y1="202" x2="928" y2="202"/>
  </g>
  <text x="600" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4f6267">DNS finds the destination. TCP opens the path. TLS protects it. HTTP carries the content.</text>
</svg>
